<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="o2-gradient" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    {/* Atom 1 */}
    <circle cx="35" cy="50" r="25" stroke="#0284C7" stroke-width="6" fill="url(#o2-gradient)" fill-opacity="0.1" />
    {/* Atom 2 */}
    <circle cx="65" cy="50" r="25" stroke="#0D9488" stroke-width="6" fill="url(#o2-gradient)" fill-opacity="0.1" />

    {/* Double Bond connection */}
    <path d="M45 42 H55" stroke="white" stroke-width="3" stroke-linecap="round" />
    <path d="M45 58 H55" stroke="white" stroke-width="3" stroke-linecap="round" />

    {/* Floating Electrons / Zen Orbits */}
    <ellipse cx="50" cy="50" rx="42" ry="15" stroke="#0284C7" stroke-width="1" stroke-opacity="0.5" transform="rotate(-15 50 50)" />
    <ellipse cx="50" cy="50" rx="42" ry="15" stroke="#0D9488" stroke-width="1" stroke-opacity="0.5" transform="rotate(15 50 50)" />
  </g>
</svg>
